[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsched"
version = "0.1.0"
description = "Convenient and Fair: volleyball pool-play scheduling (search) and format fairness (Monte Carlo)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy", "pandas", "plotly", "streamlit", "pyyaml", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
